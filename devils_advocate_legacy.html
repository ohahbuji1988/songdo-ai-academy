<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>악마의 변호인 (DEVIL'S ADVOCATE)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: '#000000',
            surface: '#0d0d0d',
            borderDark: '#222222',
            redPure: '#ff1e27',
            textDim: '#888888'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-void text-white selection:bg-redPure selection:text-black min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="w-full border-b border-borderDark px-6 py-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-redPure"></span>
        <span class="font-display font-extrabold text-sm tracking-tight text-white">
          DEVIL'S ADVOCATE
        </span>
      </div>

      <div class="flex items-center bg-surface border border-borderDark rounded p-0.5 text-xs">
        <button id="modePreset" class="px-2.5 py-1 rounded bg-white text-black font-semibold transition-all">
          즉석 모드
        </button>
        <button id="modeLive" class="px-2.5 py-1 rounded text-textDim hover:text-white transition-all">
          실시간 AI
        </button>
      </div>
    </div>
  </header>

  <!-- Optional API Key -->
  <div id="apiConfigArea" class="hidden border-b border-borderDark bg-surface py-3 px-6">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-3 text-xs">
      <span class="text-textDim">Gemini API Key:</span>
      <input type="password" id="apiKeyInput" placeholder="AI Studio 키 입력..." class="flex-1 max-w-xs px-3 py-1.5 rounded bg-black border border-borderDark text-white focus:outline-none focus:border-redPure text-xs">
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-2xl w-full mx-auto px-6 py-12 flex flex-col gap-8 my-auto">
    
    <!-- Hero Title -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
        아무 말이나 해봐.<br>
        <span class="text-redPure">1초 만에 긁어줄게.</span>
      </h1>
    </div>

    <!-- Quick Buttons -->
    <div class="flex flex-wrap gap-2">
      <button class="pill-button prompt-pill px-3 py-1.5 rounded text-xs" data-text="오늘 칼퇴함">
        오늘 칼퇴함
      </button>
      <button class="pill-button prompt-pill px-3 py-1.5 rounded text-xs" data-text="다이어트는 내일부터">
        다이어트는 내일부터
      </button>
      <button class="pill-button prompt-pill px-3 py-1.5 rounded text-xs" data-text="방향을 잃었어">
        방향을 잃었어
      </button>
      <button class="pill-button prompt-pill px-3 py-1.5 rounded text-xs" data-text="이번 주식은 진짜 오른다">
        이번 주식은 진짜 오른다
      </button>
      <button class="pill-button prompt-pill px-3 py-1.5 rounded text-xs" data-text="AI 때문에 개발자 망함?">
        AI 때문에 개발자 망함?
      </button>
      <button class="pill-button prompt-pill px-3 py-1.5 rounded text-xs" data-text="공부하려고 강의 결제함">
        공부하려고 강의 결제함
      </button>
    </div>

    <!-- Input Box -->
    <form id="roastForm" class="flex gap-2">
      <input 
        type="text" 
        id="userInput" 
        placeholder="너의 안일한 생각을 적어봐..." 
        class="flex-1 bg-surface border border-borderDark rounded-lg px-4 py-3.5 text-base text-white placeholder:text-textDim focus:outline-none focus:border-redPure transition-colors"
        required
        autocomplete="off"
      >
      <button 
        type="submit" 
        id="submitBtn" 
        class="btn-red px-6 py-3.5 rounded-lg text-sm font-bold shrink-0 cursor-pointer"
      >
        <span id="submitLabel">시비 걸기</span>
      </button>
    </form>

    <!-- Empty State -->
    <div id="emptyState" class="border border-dashed border-borderDark rounded-xl py-10 px-6 text-center text-textDim text-sm">
      위 버튼을 누르거나, 아무 말이나 적어봐.
    </div>

    <!-- The Result Card (Ultra-Clean 2-Stage) -->
    <section id="verdictStage" class="hidden flex flex-col gap-5 border border-redPure/40 bg-surface rounded-2xl p-6 sm:p-9 relative red-glow">
      
      <!-- Big Punchline in Intense Red -->
      <h2 id="headlineText" class="text-2xl sm:text-3xl md:text-4xl">
        ...
      </h2>

      <!-- Subtle Divider for Clear Hierarchy -->
      <div class="w-full border-t border-borderDark"></div>

      <!-- Crisp White Subtext with Balanced Spacing -->
      <p id="subtextText">
        ...
      </p>

      <!-- Bottom Minimal Action -->
      <div class="pt-2 flex justify-end">
        <button id="copyCardBtn" class="px-4 py-2 rounded-lg bg-black border border-borderDark text-xs text-textDim hover:text-white hover:border-redPure transition-all cursor-pointer">
          복사해서 친구 놀리기
        </button>
      </div>

    </section>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded bg-black border border-redPure text-white text-xs font-medium shadow-2xl">
    복사 완료! 친구한테 보내봐 ㅋㅋㅋ
  </div>

  <!-- Footer -->
  <footer class="w-full py-6 text-center text-xs text-textDim font-mono">
    DEVIL'S ADVOCATE
  </footer>

  <script src="app.js"></script>
</body>
</html>
